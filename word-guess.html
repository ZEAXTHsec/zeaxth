<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORDLY</title>
<style>
  :root{
    --bg:#121213;
    --tile-border:#3a3a3c;
    --tile-border-filled:#565758;
    --text:#f4f4f4;
    --green:#6a9963;
    --gold:#b8a33e;
    --gray:#3a3a3c;
    --key-bg:#818384;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px 8px 16px;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  header{
    width:100%;
    max-width:480px;
    text-align:center;
    border-bottom:1px solid #3a3a3c;
    padding-bottom:10px;
    margin-bottom:16px;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    flex-wrap:wrap;
    gap:4px 8px;
  }
  .header-left{
    position:absolute;
    left:0;
    bottom:12px;
    color:#888;
    text-decoration:none;
    font-size:0.7rem;
    letter-spacing:0.05em;
  }
  .header-center{ text-align:center; }
  h1{
    font-size:1.8rem;
    letter-spacing:0.12em;
    margin:0;
    font-weight:800;
    line-height:1;
  }
  .subtitle{
    font-size:0.65rem;
    letter-spacing:0.2em;
    color:#888;
    text-transform:uppercase;
    margin-bottom:2px;
  }
  #newgame-btn{
    position:absolute;
    right:0;
    bottom:12px;
    background:none;
    border:1px solid #565758;
    color:var(--text);
    border-radius:6px;
    padding:8px 10px;
    font-size:0.65rem;
    cursor:pointer;
    letter-spacing:0.05em;
    min-height:32px;
    -webkit-tap-highlight-color:transparent;
  }
  #newgame-btn:hover{ background:#2a2a2b; }
  @media(max-width:380px){
    h1{ font-size:1.5rem; }
    .header-left{ font-size:0.6rem; bottom:10px; }
    #newgame-btn{ font-size:0.6rem; padding:6px 8px; bottom:10px; }
  }

  /* ── Stats bar ── */
  #stats-bar{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:center;
    gap:28px;
    margin-bottom:14px;
    font-size:0.7rem;
  }
  .stat-item{
    text-align:center;
  }
  .stat-val{
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:0.03em;
  }
  .stat-label{
    font-size:0.6rem;
    color:#888;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-top:1px;
  }

  /* ── Timer & Hint row ── */
  #info-row{
    width:100%;
    max-width:340px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding:0 4px;
  }
  #timer{
    font-size:0.75rem;
    color:#888;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.04em;
  }
  #hint-btn{
    background:none;
    border:1px solid #565758;
    color:#ccc;
    border-radius:14px;
    padding:5px 14px;
    font-size:0.65rem;
    cursor:pointer;
    letter-spacing:0.04em;
    -webkit-tap-highlight-color:transparent;
    transition:all 0.15s;
  }
  #hint-btn:hover{ background:#2a2a2b; color:#fff; }
  #hint-btn.used{ opacity:0.35; pointer-events:none; border-color:#3a3a3c; }

  #board{
    display:grid;
    grid-template-rows:repeat(6, 1fr);
    gap:5px;
    margin-bottom:18px;
    width:100%;
    max-width:340px;
    padding:0 4px;
  }
  .row{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:5px;
  }
  .tile{
    aspect-ratio:1/1;
    border:2px solid var(--tile-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.7rem;
    font-weight:700;
    text-transform:uppercase;
    border-radius:4px;
    transition:transform 0.15s;
    background:#121213;
  }
  @media(max-width:360px){
    #board{ max-width:300px; gap:4px; }
    .row{ gap:4px; }
    .tile{ font-size:1.4rem; }
  }
  .tile.filled{
    border-color:var(--tile-border-filled);
    animation:pop 0.1s ease;
  }
  .tile.green{ background:var(--green); border-color:var(--green); color:#fff; }
  .tile.gold{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .tile.gray{ background:var(--gray); border-color:var(--gray); color:#fff; }
  .tile.flip{ animation:flip 0.4s ease-in-out forwards; }

  @keyframes pop{
    0%{transform:scale(0.9);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
  }
  @keyframes flip{
    0%{transform:rotateX(0deg);}
    45%{transform:rotateX(90deg);}
    55%{transform:rotateX(90deg);}
    100%{transform:rotateX(0deg);}
  }
  .row.shake{ animation:shake 0.4s; }
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);}
    40%,60%{transform:translateX(8px);}
  }

  #keyboard{
    width:100%;
    max-width:500px;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:0 2px;
  }
  .krow{
    display:flex;
    justify-content:center;
    gap:5px;
  }
  .key{
    background:var(--key-bg);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:0;
    height:50px;
    flex:1 1 0;
    min-width:0;
    font-size:0.8rem;
    font-weight:700;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.1s;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .key:active{ opacity:0.7; background:#565758; }
  .key.wide{ flex:1.5 1 0; font-size:0.6rem; }
  .key.green{ background:var(--green); }
  .key.gold{ background:var(--gold); }
  .key.gray{ background:#3a3a3c; color:#888; }

  #toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:#121213;
    padding:12px 20px;
    border-radius:6px;
    font-weight:700;
    font-size:0.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
    z-index:10;
    max-width:90vw;
    text-align:center;
  }
  #toast.show{ opacity:1; }

  #modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
  }
  #modal-overlay.show{ display:flex; }
  #modal{
    background:#1e1e1f;
    border-radius:10px;
    padding:24px 28px;
    text-align:center;
    max-width:320px;
    width:90vw;
    border:1px solid #3a3a3c;
    margin:0 8px;
  }
  #modal h2{ margin:0 0 8px; letter-spacing:0.05em; }
  #modal p{ color:#ccc; font-size:0.85rem; margin:4px 0 16px; }
  #modal-word{ color:var(--green); font-weight:800; letter-spacing:0.1em; }
  #modal button{
    background:var(--green);
    border:none;
    color:#fff;
    padding:12px 24px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
    font-size:0.85rem;
    letter-spacing:0.05em;
    min-height:44px;
    -webkit-tap-highlight-color:transparent;
  }

  /* ── Stats Modal ── */
  #stats-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:25;
  }
  #stats-overlay.show{ display:flex; }
  #stats-modal{
    background:#1e1e1f;
    border-radius:12px;
    padding:28px 24px 20px;
    text-align:center;
    max-width:380px;
    width:92vw;
    border:1px solid #3a3a3c;
    position:relative;
    max-height:90vh;
    overflow-y:auto;
  }
  #stats-close{
    position:absolute;
    right:14px;
    top:10px;
    background:none;
    border:none;
    color:#888;
    font-size:1.3rem;
    cursor:pointer;
    padding:6px 10px;
    -webkit-tap-highlight-color:transparent;
  }
  #stats-modal h3{
    margin:0 0 16px;
    letter-spacing:0.06em;
    font-size:1rem;
  }
  #stats-modal .stats-row{
    display:flex;
    justify-content:center;
    gap:24px;
    margin-bottom:18px;
  }
  #stats-modal .stat-item .stat-val{ font-size:1.6rem; }

  /* distribution */
  .dist-title{
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.08em;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .dist-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:4px;
    font-size:0.75rem;
  }
  .dist-label{ width:16px; text-align:right; color:#888; }
  .dist-bar{
    flex:1;
    height:22px;
    background:var(--green);
    border-radius:3px;
    min-width:20px;
    display:flex;
    align-items:center;
    padding-left:8px;
    font-size:0.65rem;
    font-weight:700;
    transition:width 0.4s ease;
  }
  .dist-bar.zero{ background:#3a3a3c; color:#888; }

  /* share btn */
  #share-btn{
    background:#538d4e;
    border:none;
    color:#fff;
    padding:12px 28px;
    border-radius:20px;
    font-weight:700;
    cursor:pointer;
    font-size:0.8rem;
    letter-spacing:0.05em;
    margin-top:6px;
    -webkit-tap-highlight-color:transparent;
  }
  #share-btn:active{ opacity:0.8; }
  #share-btn.copied{ background:#3a3a3c; }

  /* confetti */
  .confetti-piece{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:2px;
    pointer-events:none;
    z-index:30;
    animation:confettiFall 1.2s ease-out forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg) scale(1); opacity:1; }
    100%{ transform:translateY(105vh) rotate(720deg) scale(0.3); opacity:0; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="header-left">← ZEAXTH</a>
  <div class="header-center">
    <div class="subtitle">Guess the word</div>
    <h1>WORDLY</h1>
  </div>
  <button id="newgame-btn">NEW GAME</button>
</header>

<div id="stats-bar">
  <div class="stat-item"><div class="stat-val" id="stat-played">0</div><div class="stat-label">Played</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-winpc">—</div><div class="stat-label">Win %</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-streak">0</div><div class="stat-label">Streak</div></div>
  <div class="stat-item"><div class="stat-val" id="stat-maxstreak">0</div><div class="stat-label">Max</div></div>
</div>

<div id="info-row">
  <div id="timer">00:00</div>
  <button id="hint-btn">💡 Hint</button>
</div>

<div id="board"></div>

<div id="keyboard"></div>

<div id="toast"></div>

<div id="modal-overlay">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-sub">The word was <span id="modal-word"></span></p>
    <button id="share-btn">📋 Share</button>
    <button id="modal-btn" style="margin-top:6px;">PLAY AGAIN</button>
  </div>
</div>

<div id="stats-overlay">
  <div id="stats-modal">
    <button id="stats-close">✕</button>
    <h3>📊 STATISTICS</h3>
    <div class="stats-row">
      <div class="stat-item"><div class="stat-val" id="m-played">0</div><div class="stat-label">Played</div></div>
      <div class="stat-item"><div class="stat-val" id="m-winpc">—</div><div class="stat-label">Win %</div></div>
      <div class="stat-item"><div class="stat-val" id="m-streak">0</div><div class="stat-label">Streak</div></div>
      <div class="stat-item"><div class="stat-val" id="m-max">0</div><div class="stat-label">Max</div></div>
    </div>
    <div class="dist-title">Guess Distribution</div>
    <div id="dist-container"></div>
  </div>
</div>

<script>
const WORDS = [
  "GRAPE","BRAVE","TRACE","WALES","STONE","PLANE","CRANE","SHINE","BLAZE","FLAME",
  "PRIDE","CLOUD","STORM","RIVER","LIGHT","NIGHT","SOUND","EARTH","GHOST","MAGIC",
  "PIANO","TIGER","EAGLE","OCEAN","MOUNT","FIELD","BRICK","GLASS","PAPER","METAL",
  "CHESS","QUEEN","WOMAN","CHILD","HOUSE","MOUSE","HORSE","SHEEP","PLANT","FRUIT",
  "JUICE","BREAD","SUGAR","SALAD","STEAK","PIZZA","CANDY","CHAIR","TABLE","COUCH",
  "BEACH","WATER","SPACE","ROBOT","LASER","SWORD","SHARK","WHALE","PANDA","ZEBRA",
  "MONEY","BONUS","TRUST","POWER","MOVIE","MUSIC","DANCE","SMILE","LAUGH","HAPPY",
  "ANGER","PEACE","DREAM","SLEEP","AWAKE","BRAIN","HEART","BLOOD","BONES","SKULL",
  "STORY","NOVEL","WORDS","BOOKS","PAGES","TREND",
  "CRAFT","BUILD","MAKER","TRADE","FOCUS","SHARP","QUICK","SWIFT","LEVEL","STAGE"
];

// ── Daily word (same for everyone each day) ──
function getDailyWord(){
  const now = new Date();
  const seed = now.getFullYear()*10000 + (now.getMonth()+1)*100 + now.getDate();
  let hash = 0;
  const s = String(seed);
  for(let i=0;i<s.length;i++){ hash = ((hash<<5)-hash)+s.charCodeAt(i); hash |= 0; }
  return WORDS[Math.abs(hash) % WORDS.length];
}

// ── Stats persistence ──
const STATS_KEY = 'wordly_stats_v1';
function loadStats(){
  try{
    const raw = localStorage.getItem(STATS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { played:0, wins:0, streak:0, maxStreak:0, dist:[0,0,0,0,0,0], lastDate:'' };
}
function saveStats(s){ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }

let stats = loadStats();
let hintUsed = false;
let timerSec = 0;
let timerInterval = null;
let lastGuessResults = null; // for share

const ROWS = 6;
const WORD_LEN = 5;
let answer = "";
let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let keyStates = {};

const board = document.getElementById('board');
const keyboard = document.getElementById('keyboard');
const toast = document.getElementById('toast');
const modalOverlay = document.getElementById('modal-overlay');
const modalTitle = document.getElementById('modal-title');
const modalWord = document.getElementById('modal-word');
const modalBtn = document.getElementById('modal-btn');
const newGameBtn = document.getElementById('newgame-btn');
const shareBtn = document.getElementById('share-btn');
const statsOverlay = document.getElementById('stats-overlay');
const statsClose = document.getElementById('stats-close');
const hintBtn = document.getElementById('hint-btn');
const timerEl = document.getElementById('timer');
const distContainer = document.getElementById('dist-container');

const KEY_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫']
];

function startTimer(){
  timerSec = 0;
  updateTimer();
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{ timerSec++; updateTimer(); }, 1000);
}
function stopTimer(){ clearInterval(timerInterval); }
function updateTimer(){
  const m = Math.floor(timerSec/60);
  const s = timerSec%60;
  timerEl.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function updateStatsBar(){
  document.getElementById('stat-played').textContent = stats.played;
  const winpc = stats.played>0 ? Math.round(stats.wins/stats.played*100) : null;
  document.getElementById('stat-winpc').textContent = winpc!==null ? winpc+'%' : '—';
  document.getElementById('stat-streak').textContent = stats.streak;
  document.getElementById('stat-maxstreak').textContent = stats.maxStreak;
}

function buildDistBars(){
  const max = Math.max(1, ...stats.dist);
  distContainer.innerHTML = stats.dist.map((n,i)=>{
    const w = Math.round(n/max*100);
    return '<div class="dist-row"><span class="dist-label">'+(i+1)+'</span>'+
      '<div class="dist-bar'+(n===0?' zero':'')+'" style="width:'+(w||5)+'%">'+
      (n>0?n:'')+'</div></div>';
  }).join('');
}

function showStats(){
  document.getElementById('m-played').textContent = stats.played;
  const wp = stats.played>0 ? Math.round(stats.wins/stats.played*100)+'%' : '—';
  document.getElementById('m-winpc').textContent = wp;
  document.getElementById('m-streak').textContent = stats.streak;
  document.getElementById('m-max').textContent = stats.maxStreak;
  buildDistBars();
  statsOverlay.classList.add('show');
}

function initBoard(){
  board.innerHTML = "";
  for(let r=0;r<ROWS;r++){
    const row = document.createElement('div');
    row.className = 'row';
    row.id = 'row-'+r;
    for(let c=0;c<WORD_LEN;c++){
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = 'tile-'+r+'-'+c;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function initKeyboard(){
  keyboard.innerHTML = "";
  KEY_ROWS.forEach(rowKeys=>{
    const krow = document.createElement('div');
    krow.className = 'krow';
    rowKeys.forEach(k=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'key' + (k.length>1?' wide':'');
      btn.textContent = k;
      btn.id = 'key-'+k;
      // pointerdown fires reliably on both mouse click and touch tap
      btn.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        handleKey(k);
      });
      krow.appendChild(btn);
    });
    keyboard.appendChild(krow);
  });
}

function newGame(){
  answer = getDailyWord();
  currentRow = 0;
  currentGuess = "";
  gameOver = false;
  keyStates = {};
  hintUsed = false;
  lastGuessResults = null;
  hintBtn.classList.remove('used');
  hintBtn.textContent = '💡 Hint';
  initBoard();
  document.querySelectorAll('.key').forEach(k=>{
    k.classList.remove('green','gold','gray');
  });
  modalOverlay.classList.remove('show');
  statsOverlay.classList.remove('show');
  shareBtn.classList.remove('copied');
  shareBtn.textContent = '📋 Share';
  updateStatsBar();
  startTimer();
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1200);
}

function shakeRow(r){
  const row = document.getElementById('row-'+r);
  row.classList.add('shake');
  setTimeout(()=>row.classList.remove('shake'), 400);
}

function useHint(){
  if(hintUsed || gameOver) return;
  hintUsed = true;
  hintBtn.classList.add('used');
  hintBtn.textContent = '💡 Used';
  // reveal one unrevealed green position
  const candidates = [];
  for(let i=0;i<WORD_LEN;i++){
    const tile = document.getElementById('tile-'+currentRow+'-'+i);
    if(!tile.classList.contains('green')) candidates.push(i);
  }
  if(!candidates.length) return;
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  const tile = document.getElementById('tile-'+currentRow+'-'+pick);
  tile.textContent = answer[pick];
  tile.classList.add('filled','green');
  // also update keyStates so the keyboard colors reflect it
  const letter = answer[pick];
  keyStates[letter] = 'green';
  const keyEl = document.getElementById('key-'+letter);
  if(keyEl){ keyEl.classList.remove('green','gold','gray'); keyEl.classList.add('green'); }
}

function handleKey(k){
  if(gameOver) return;
  if(k === 'ENTER'){
    submitGuess();
  } else if(k === '⌫' || k === 'BACKSPACE'){
    currentGuess = currentGuess.slice(0,-1);
    updateRow();
  } else if(/^[A-Z]$/.test(k) && currentGuess.length < WORD_LEN){
    currentGuess += k;
    updateRow();
  }
}

function updateRow(){
  for(let c=0;c<WORD_LEN;c++){
    const tile = document.getElementById('tile-'+currentRow+'-'+c);
    const letter = currentGuess[c] || "";
    tile.textContent = letter;
    tile.classList.toggle('filled', !!letter);
  }
}

function submitGuess(){
  if(currentGuess.length < WORD_LEN){
    showToast("Not enough letters");
    shakeRow(currentRow);
    return;
  }
  const guess = currentGuess;
  const result = scoreGuess(guess, answer);

  // store result for share
  if(!lastGuessResults) lastGuessResults = [];
  lastGuessResults.push(result);

  result.forEach((state, i)=>{
    const tile = document.getElementById('tile-'+currentRow+'-'+i);
    setTimeout(()=>{
      tile.classList.add(state);
    }, i*150);
  });

  // update keyboard colors after reveal
  setTimeout(()=>{
    result.forEach((state, i)=>{
      const letter = guess[i];
      const rank = {gray:0, gold:1, green:2};
      if(!keyStates[letter] || rank[state] > rank[keyStates[letter]]){
        keyStates[letter] = state;
        const keyEl = document.getElementById('key-'+letter);
        if(keyEl){
          keyEl.classList.remove('green','gold','gray');
          keyEl.classList.add(state);
        }
      }
    });

    if(guess === answer){
      endGame(true);
    } else if(currentRow === ROWS-1){
      endGame(false);
    } else {
      currentRow++;
      currentGuess = "";
    }
  }, WORD_LEN*150 + 100);
}

function scoreGuess(guess, answer){
  const result = new Array(WORD_LEN).fill('gray');
  const answerArr = answer.split('');
  const used = new Array(WORD_LEN).fill(false);

  // greens first
  for(let i=0;i<WORD_LEN;i++){
    if(guess[i] === answerArr[i]){
      result[i] = 'green';
      used[i] = true;
    }
  }
  // golds
  for(let i=0;i<WORD_LEN;i++){
    if(result[i] === 'green') continue;
    let found = false;
    for(let j=0;j<WORD_LEN;j++){
      if(!used[j] && guess[i] === answerArr[j]){
        used[j] = true;
        found = true;
        break;
      }
    }
    if(found) result[i] = 'gold';
  }
  return result;
}

function spawnConfetti(){
  const colors = ['#6a9963','#b8a33e','#818384','#f4f4f4','#538d4e','#c9b458'];
  for(let i=0;i<40;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100+'%';
    piece.style.top = -(Math.random()*20+10)+'px';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = Math.random()*0.4+'s';
    piece.style.animationDuration = (Math.random()*0.8+1)+'s';
    piece.style.width = (Math.random()*6+4)+'px';
    piece.style.height = (Math.random()*6+4)+'px';
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 1600);
  }
}

function shareResults(){
  const emoji = {green:'🟩', gold:'🟨', gray:'⬛'};
  const now = new Date();
  const dateStr = (now.getMonth()+1)+'/'+now.getDate();
  const guessCount = lastGuessResults ? lastGuessResults.length : '?';
  const lines = ['WORDLY 📆 '+dateStr+' '+(wonLast?'✅':'❌')+' '+guessCount+'/6'];
  if(lastGuessResults){
    lastGuessResults.forEach(r => lines.push(r.map(s=>emoji[s]).join('')));
  }
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      shareBtn.textContent = '✅ Copied!';
      shareBtn.classList.add('copied');
    }).catch(()=>{});
  } else {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    shareBtn.textContent = '✅ Copied!';
    shareBtn.classList.add('copied');
  }
}

let wonLast = false;

function endGame(won){
  gameOver = true;
  wonLast = won;
  stopTimer();
  if(won) spawnConfetti();

  // update stats (only count once per day)
  const today = new Date().toDateString();
  if(stats.lastDate !== today){
    stats.played++;
    if(won){
      stats.wins++;
      stats.streak++;
      if(stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
      const guessCount = lastGuessResults ? lastGuessResults.length : 6;
      if(guessCount>=1 && guessCount<=6) stats.dist[guessCount-1]++;
    } else {
      stats.streak = 0;
    }
    stats.lastDate = today;
    saveStats(stats);
    updateStatsBar();
  }

  setTimeout(()=>{
    modalTitle.textContent = won ? "SPLENDID!" : "NICE TRY";
    modalWord.textContent = answer;
    shareBtn.classList.remove('copied');
    shareBtn.textContent = '📋 Share';
    modalOverlay.classList.add('show');
  }, 600);
}

document.addEventListener('keydown', (e)=>{
  if(gameOver) return;
  let k = e.key.toUpperCase();
  if(k === 'BACKSPACE') k = '⌫';
  if(k === 'ENTER' || k === '⌫' || /^[A-Z]$/.test(k)){
    e.preventDefault();
    handleKey(k);
  }
});

// keep focus on the page so physical keyboard presses are always caught,
// even inside an iframe preview
document.body.tabIndex = -1;
document.body.style.outline = 'none';
window.addEventListener('load', ()=>document.body.focus());
document.addEventListener('click', ()=>document.body.focus());

modalBtn.addEventListener('click', newGame);
newGameBtn.addEventListener('click', newGame);

shareBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  shareResults();
});

hintBtn.addEventListener('click', useHint);

// open stats modal when tapping stats bar
document.getElementById('stats-bar').addEventListener('click', showStats);
statsClose.addEventListener('click', ()=>statsOverlay.classList.remove('show'));
statsOverlay.addEventListener('click', (e)=>{
  if(e.target === statsOverlay) statsOverlay.classList.remove('show');
});

updateStatsBar();
initKeyboard();
startTimer();
newGame();
</script>
