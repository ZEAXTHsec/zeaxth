<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEAXTH — Micro Games</title>
<style>
  :root{
    --bg:#121213;
    --tile-border:#3a3a3c;
    --text:#f4f4f4;
    --green:#6a9963;
    --gold:#b8a33e;
    --gray:#3a3a3c;
    --card-bg:#1a1a1b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 16px 32px;
    user-select:none;
  }

  /* ── Header ── */
  header{
    text-align:center;
    margin-bottom:48px;
  }
  h1{
    font-size:2.6rem;
    letter-spacing:0.12em;
    margin:0;
    font-weight:800;
    background:linear-gradient(135deg, var(--green) 0%, #8cc97e 50%, var(--gold) 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .tagline{
    font-size:0.75rem;
    letter-spacing:0.22em;
    color:#777;
    text-transform:uppercase;
    margin-top:8px;
  }

  /* ── Game Grid ── */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
    width:100%;
    max-width:780px;
  }
  @media(min-width:480px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media(min-width:768px){
    .grid{ grid-template-columns:repeat(3, 1fr); }
  }

  /* ── Card ── */
  .card{
    background:var(--card-bg);
    border:1px solid var(--tile-border);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
    opacity:0;
    transform:translateY(24px);
    animation:fadeUp 0.5s ease forwards;
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .card:nth-child(1){ animation-delay:0.05s; }
  .card:nth-child(2){ animation-delay:0.15s; }
  .card:nth-child(3){ animation-delay:0.25s; }
  .card:nth-child(4){ animation-delay:0.35s; }

  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 32px rgba(0,0,0,0.5), 0 0 0 1px var(--tile-border);
  }
  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .card-accent{
    height:4px;
    width:100%;
  }
  .card-accent.green{ background:var(--green); }
  .card-accent.gold{ background:var(--gold); }
  .card-accent.ghost{ background:#565758; }

  .card-body{
    padding:20px 22px 18px;
  }
  .card-icon{
    font-size:2rem;
    margin-bottom:8px;
  }
  .card-title{
    font-size:1.1rem;
    font-weight:700;
    letter-spacing:0.06em;
    margin-bottom:6px;
  }
  .card-desc{
    font-size:0.8rem;
    color:#999;
    line-height:1.4;
    margin-bottom:14px;
  }
  .card-btn{
    display:inline-block;
    background:transparent;
    border:1px solid var(--tile-border);
    color:var(--text);
    padding:7px 18px;
    border-radius:6px;
    font-weight:700;
    font-size:0.75rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    transition:background 0.15s;
  }
  .card:hover .card-btn{ background:var(--tile-border); }

  /* ── Coming Soon Card ── */
  .card.coming-soon{
    cursor:default;
    pointer-events:none;
  }
  .card.coming-soon:hover{
    transform:none;
    box-shadow:none;
  }
  .card.coming-soon .card-btn{
    opacity:0.5;
  }
  @keyframes pulseGlow{
    0%,100%{ border-color:var(--tile-border); }
    50%{ border-color:#565758; }
  }
  .card.coming-soon{
    animation:fadeUp 0.5s ease forwards, pulseGlow 2.5s ease-in-out infinite;
  }

  /* ── Footer ── */
  footer{
    margin-top:48px;
    font-size:0.7rem;
    color:#555;
    letter-spacing:0.1em;
  }
</style>
</head>
<body>

<header>
  <h1>ZEAXTH</h1>
  <div class="tagline">micro games, no downloads</div>
</header>

<div class="grid">
  <!-- WORDLY card -->
  <a class="card" href="word-guess.html">
    <div class="card-accent green"></div>
    <div class="card-body">
      <div class="card-icon">🔤</div>
      <div class="card-title">WORDLY</div>
      <div class="card-desc">Guess the 5-letter word in 6 tries. A fresh puzzle every game.</div>
      <span class="card-btn">Play</span>
    </div>
  </a>

  <!-- Coming soon -->
  <div class="card coming-soon">
    <div class="card-accent ghost"></div>
    <div class="card-body">
      <div class="card-icon">🎮</div>
      <div class="card-title">Coming Soon</div>
      <div class="card-desc">More micro games are on the way. Stay tuned.</div>
      <span class="card-btn">Soon</span>
    </div>
  </div>
</div>

<footer>more games coming soon</footer>

</body>
</html>
